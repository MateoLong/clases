<!doctype html>
<html lang="es-UY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis clases</title>
  <meta name="theme-color" content="#2347b5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mis clases">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="clases.css">
</head>
<body>
  <a class="skip" href="#main">Ir al contenido</a>
  <header class="band">
    <div class="band-inner">
      <a class="brand" href="#/agenda" aria-label="Inicio">
        <span class="brand-mark" aria-hidden="true"><svg><use href="icons.svg#i-calendar-days"/></svg></span>
        <span class="brand-name" data-testid="app-title">Mis clases</span>
      </a>
      <nav class="tabs" aria-label="Secciones">
        <a href="#/agenda" data-tab="agenda"><svg aria-hidden="true"><use href="icons.svg#i-calendar-days"/></svg>Agenda</a>
        <a href="#/alumnos" data-tab="alumnos"><svg aria-hidden="true"><use href="icons.svg#i-users"/></svg>Alumnos</a>
        <a href="#/ganancias" data-tab="ganancias"><svg aria-hidden="true"><use href="icons.svg#i-chart-column"/></svg>Ganancias</a>
        <a href="#/proyeccion" data-tab="proyeccion"><svg aria-hidden="true"><use href="icons.svg#i-trending-up"/></svg>¿Y si…?</a>
        <a href="#/ajustes" data-tab="ajustes"><svg aria-hidden="true"><use href="icons.svg#i-settings"/></svg>Ajustes</a>
      </nav>
      <div class="currency-switch" role="group" aria-label="Moneda">
        <button type="button" data-currency="UYU" aria-pressed="true">UYU</button>
        <button type="button" data-currency="USD" aria-pressed="false">USD</button>
      </div>
      <a class="help-link" href="#/ayuda" data-tab="ayuda" aria-label="Cómo se usa" title="Cómo se usa" data-testid="help-link">?</a>
    </div>
  </header>
  <div class="demo-strip" data-testid="demo-strip" hidden>
    <p>Estás viendo <strong>datos de ejemplo</strong>. Probá todo lo que quieras; cuando empieces en serio, borralos.</p>
    <button type="button" class="btn btn-quiet" data-action="clear-demo">Borrar datos de ejemplo</button>
  </div>
  <main id="main" tabindex="-1"></main>
  <div class="toasts" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
